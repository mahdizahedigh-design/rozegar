<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c202a"/>
      <stop offset="50%" stop-color="#14161f"/>
      <stop offset="100%" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce289"/>
      <stop offset="45%" stop-color="#e5a93b"/>
      <stop offset="85%" stop-color="#be791e"/>
      <stop offset="100%" stop-color="#8a530f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fce289" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#be791e" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Background: Rounded Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>
  <rect width="490" height="490" x="11" y="11" rx="104" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Persepolis Achaemenid Double-Headed Bull Column Capital & Pedestal -->
  <g transform="translate(256, 260)" filter="url(#goldGlow)">
    <!-- Column Base / Pedestal -->
    <path d="M-85,130 L85,130 L75,110 L-75,110 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-65" y="95" width="130" height="15" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    
    <!-- Inscription 2583 Box -->
    <rect x="-42" y="113" width="84" height="14" rx="3" fill="#14161f" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="124" text-anchor="middle" font-family="'Vazirmatn', sans-serif" font-size="11" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2">۲۵۸۳</text>

    <!-- Fluted Columns -->
    <rect x="-58" y="25" width="116" height="70" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>
    <!-- Flutes -->
    <line x1="-38" y1="30" x2="-38" y2="90" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="-19" y1="30" x2="-19" y2="90" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="0" y2="90" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="19" y1="30" x2="19" y2="90" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="38" y1="30" x2="38" y2="90" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Capital Top Plate -->
    <path d="M-72,25 L72,25 L62,10 L-62,10 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- Double Bull Torso & Kneeling Legs -->
    <path d="M-105,10 C-100,-15 -75,-25 -40,-20 C-10,-18 10,-18 40,-20 C75,-25 100,-15 105,10 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-85,10 C-80,-5 -50,-8 0,-8 C50,-8 80,-5 85,10" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Left Bull Head & Horns -->
    <g>
      <!-- Horn -->
      <path d="M-60,-80 C-85,-115 -115,-125 -125,-120 C-125,-110 -105,-85 -75,-65" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Neck & Back Curve -->
      <path d="M-15,-20 C-20,-60 -45,-95 -75,-65 C-95,-45 -110,-25 -115,-50 C-115,-70 -90,-85 -75,-85" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Snout and Jaw -->
      <path d="M-105,-45 C-115,-40 -120,-20 -115,-5 C-110,5 -95,-5 -90,-15 C-85,-25 -75,-40 -95,-45" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
      <!-- Eye -->
      <circle cx="-95" cy="-35" r="3" fill="url(#goldGrad)"/>
      <!-- Ear -->
      <path d="M-68,-55 C-80,-65 -85,-55 -75,-45 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Right Bull Head & Horns -->
    <g>
      <!-- Horn -->
      <path d="M60,-80 C85,-115 115,-125 125,-120 C125,-110 105,-85 75,-65" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
      <!-- Neck & Back Curve -->
      <path d="M15,-20 C20,-60 45,-95 75,-65 C95,-45 110,-25 115,-50 C115,-70 90,-85 75,-85" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>
      <!-- Snout and Jaw -->
      <path d="M105,-45 C115,-40 120,-20 115,-5 C110,5 95,-5 90,-15 C85,-25 75,-40 95,-45" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>
      <!-- Eye -->
      <circle cx="95" cy="-35" r="3" fill="url(#goldGrad)"/>
      <!-- Ear -->
      <path d="M68,-55 C80,-65 85,-55 75,-45 Z" fill="url(#goldGrad)"/>
    </g>
  </g>
</svg>
